<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f7f9;
        }

        /* Navbar Styling */
        .navbar {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .logout {
            color: white;
            text-decoration: none;
        }

        /* Form Container */
        .container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .registration-form {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* Input Groupings */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Horizontal Radio and Checkbox alignment */
        .radio-group, .checkbox-group {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
        }

        .radio-group input, .checkbox-group input {
            margin-right: -5px;
        }


        /* Buttons */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-register {
            background-color: #007bff;
        }

        .btn-clear {
            background-color: #6c757d;
        }

        button:hover {
            opacity: 0.9;
        }


    </style>
</head>
<body>

    <nav class="navbar">
        <span>Welcome, User</span>
        <a href="#" class="logout">Logout</a>
    </nav>

    <main class="container">
        <form class="registration-form">
            <h2>Student Registration</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullname">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age">
            </div>

            <div class="form-group">
                <label>Select Course</label>
                <select name="course">
                    <option value="">-- Select Course --</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                </select>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" name="gender" id="male"> <label for="male">Male</label>
                    <input type="radio" name="gender" id="female"> <label for="female">Female</label>
                    <input type="radio" name="gender" id="other"> <label for="other">Other</label>
                </div>
            </div>

            <div class="form-group">
                <label>Hobbies</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="reading"> <label for="reading">Reading</label>
                    <input type="checkbox" id="music"> <label for="music">Music</label>
                    <input type="checkbox" id="sports"> <label for="sports">Sports</label>
                    <input type="checkbox" id="coding"> <label for="coding">Coding</label>
                </div>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="dob">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email">
            </div>

            <div class="form-group">
                <label>Mobile</label>
                <input type="tel" name="mobile">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" rows="3"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-register">Register</button>
                <button type="reset" class="btn-clear">Clear</button>
            </div>
        </form>
    </main>

</body>
</html>
